[workspace]
resolver = "2"
members = [
    "crates/saeitoshi",
    "crates/saeitoshi-python",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# AVX-512 intrinsics (e.g. _mm512_reduce_add_ps) used in kernels/x86.rs
# stabilized in Rust 1.89.
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Khangdang1690/saeitoshi"
homepage = "https://github.com/Khangdang1690/saeitoshi"
authors = ["Khang Dang"]

[workspace.dependencies]
thiserror = "1.0"
memmap2 = "0.9"
half = { version = "2.4", features = ["bytemuck"] }
bytemuck = { version = "1.16", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ndarray = "0.16"
rayon = "1.10"
crossbeam-queue = "0.3"
safetensors = "0.4"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.bench]
inherits = "release"
debug = true
strip = "none"
