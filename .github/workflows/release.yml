name: Release

on:
  push:
    tags: ["v*"]

jobs:
  publish-pypi:
    name: Publish wheels to PyPI
    needs: []
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/saeitoshi
    permissions:
      id-token: write   # PyPI OIDC trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish via twine
        run: |
          pip install twine
          twine upload --skip-existing dist/*.whl dist/*.tar.gz

  publish-crates-io:
    name: Publish core crate to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --package saeitoshi
