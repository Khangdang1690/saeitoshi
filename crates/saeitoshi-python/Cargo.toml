[package]
name = "saeitoshi-python"
description = "Python bindings for saeitoshi."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "_native"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
saeitoshi = { path = "../saeitoshi" }
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py310"] }
numpy = "0.22"
ndarray.workspace = true

[features]
# Pass-through to the inner crate's feature so `maturin develop --features
# perf-v2` (and downstream wheels) can opt into the tiled GEMM backend.
perf-v2 = ["saeitoshi/perf-v2"]
