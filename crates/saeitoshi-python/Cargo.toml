[package]
name = "saeitoshi-python"
description = "Python bindings for saeitoshi."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "_native"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
saeitoshi = { path = "../saeitoshi" }
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py310"] }
numpy = "0.22"
ndarray.workspace = true

[features]
default = ["perf-v2", "topk-v2"]
# Pass-through to the inner crate's feature. Default is on; flip off by
# building with `maturin develop --no-default-features` to ship the v0
# legacy kernel for regression bisection.
perf-v2 = ["saeitoshi/perf-v2"]
topk-v2 = ["saeitoshi/topk-v2"]
