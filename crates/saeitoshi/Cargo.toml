[package]
name = "saeitoshi"
description = "Fast inference engine for Sparse Autoencoders. The FAISS-equivalent for SAEs."
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lib]
name = "saeitoshi"
path = "src/lib.rs"

[dependencies]
thiserror.workspace = true
memmap2.workspace = true
half.workspace = true
bytemuck.workspace = true
serde.workspace = true
serde_json.workspace = true
ndarray.workspace = true
rayon.workspace = true
crossbeam-queue.workspace = true
safetensors.workspace = true

[dev-dependencies]
criterion = "0.5"
proptest = "1.5"
tempfile = "3.10"
# Re-listed here so integration tests under `tests/` can build SAELens-format
# fixtures without depending on the library's internal types.
safetensors = { workspace = true }
bytemuck = { workspace = true }
serde_json = { workspace = true }

[[bench]]
name = "encoder"
harness = false

[[bench]]
name = "topk"
harness = false

[features]
# v0.1: perf-v2 is on by default. The legacy per-dot-product kernels are
# still compiled in and reachable at runtime via SAEITOSHI_BACKEND=legacy
# for one release in case a regression needs bisection. To bench the
# legacy path standalone, build with `--no-default-features`.
# v0.2: topk-v2 is on by default. The legacy full-sort TopK in
# `kernels::scalar::topk_select` stays compiled in, reachable via
# SAEITOSHI_TOPK=legacy for A/B bisection.
default = ["perf-v2", "topk-v2"]
# Enables x86 SIMD intrinsics. On by default on x86_64; off elsewhere.
simd-x86 = []
# Enables NEON intrinsics. On by default on aarch64; off elsewhere.
simd-neon = []
# Cache-tiled, register-blocked GEMM encoder. See docs/perf-analysis.md.
perf-v2 = []
# Heap-based partial-sort TopK with branchless CAS + rayon row-level
# threading. See docs/perf-analysis.md.
topk-v2 = []
