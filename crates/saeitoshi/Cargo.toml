[package]
name = "saeitoshi"
description = "Fast inference engine for Sparse Autoencoders. The FAISS-equivalent for SAEs."
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lib]
name = "saeitoshi"
path = "src/lib.rs"

[dependencies]
thiserror.workspace = true
memmap2.workspace = true
half.workspace = true
bytemuck.workspace = true
serde.workspace = true
serde_json.workspace = true
ndarray.workspace = true
rayon.workspace = true
crossbeam-queue.workspace = true
safetensors.workspace = true

[dev-dependencies]
criterion = "0.5"
proptest = "1.5"
tempfile = "3.10"

[[bench]]
name = "encoder"
harness = false

[features]
default = []
# Enables x86 SIMD intrinsics. On by default on x86_64; off elsewhere.
simd-x86 = []
# Enables NEON intrinsics. On by default on aarch64; off elsewhere.
simd-neon = []
