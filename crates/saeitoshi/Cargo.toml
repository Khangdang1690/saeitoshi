[package]
name = "saeitoshi"
description = "Fast inference engine for Sparse Autoencoders. The FAISS-equivalent for SAEs."
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lib]
name = "saeitoshi"
path = "src/lib.rs"

[dependencies]
thiserror.workspace = true
memmap2.workspace = true
half.workspace = true
bytemuck.workspace = true
serde.workspace = true
serde_json.workspace = true
ndarray.workspace = true
rayon.workspace = true
crossbeam-queue.workspace = true
safetensors.workspace = true

[dev-dependencies]
criterion = "0.5"
proptest = "1.5"
tempfile = "3.10"
# Re-listed here so integration tests under `tests/` can build SAELens-format
# fixtures without depending on the library's internal types.
safetensors = { workspace = true }
bytemuck = { workspace = true }
serde_json = { workspace = true }

[[bench]]
name = "encoder"
harness = false

[[bench]]
name = "topk"
harness = false

[features]
default = ["topk-v2"]
# Heap-based partial-sort TopK with branchless CAS + rayon row-level
# threading. See docs/perf-analysis.md. (Deleted in the next commit; the
# heap path becomes unconditional.)
topk-v2 = []
